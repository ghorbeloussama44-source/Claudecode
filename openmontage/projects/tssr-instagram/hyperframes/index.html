<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>TSSR — Pub Instagram (aperçu 0–8 s)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat-900-latin.woff2") format("woff2");
        font-weight: 700 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212;
      }
      @font-face {
        font-family: "Cairo";
        src: url("assets/fonts/Cairo-arabic.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "Aref Ruqaa";
        src: url("assets/fonts/ArefRuqaa-700-arabic.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      :root {
        --blue: #1f3fbf;
        --navy: #0b1f6b;
        --sky: #3b82f6;
        --red: #e31b23;
        --flag-blue: #0039a6;
        --flag-red: #d52b1e;
        --white: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1f6b; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Montserrat", "Cairo", sans-serif; color: #fff; }
      .clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .fill { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .ar { direction: rtl; unicode-bidi: isolate; font-family: "Cairo", sans-serif; }

      /* ---------- persistent brand chip (TSSR · Study in Russia) */
      #chip {
        position: absolute; left: 72px; top: 196px; height: 74px; padding: 0 30px 0 14px;
        display: flex; align-items: center; gap: 16px; border-radius: 999px; background: #fff;
        box-shadow: 0 10px 30px rgba(11, 31, 107, 0.35); direction: ltr;
      }
      #chip .dot { width: 50px; height: 50px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; }
      #chip .t { font-weight: 900; font-size: 34px; letter-spacing: -0.02em; color: var(--blue); }
      #chip .bar { width: 3px; height: 34px; background: rgba(11, 31, 107, 0.2); }
      #chip .s { font-weight: 700; font-size: 26px; color: #0f172a; letter-spacing: -0.01em; }

      /* ---------- S1 : القراية في روسيا */
      #s1-photo { background: url("assets/img/saint_basile.jpg") center 30% / cover no-repeat; transform-origin: 50% 40%; }
      #s1-tint {
        background: linear-gradient(180deg, rgba(31, 63, 191, 0.55) 0%, rgba(31, 63, 191, 0.05) 32%, rgba(11, 31, 107, 0) 50%, rgba(11, 31, 107, 0.82) 78%, rgba(11, 31, 107, 0.95) 100%);
      }
      #flag { position: absolute; left: 0; top: 0; }
      #s1-glint {
        background: linear-gradient(115deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 62%);
        mix-blend-mode: overlay; opacity: 0;
      }
      #s1-title { position: absolute; right: 132px; top: 1090px; text-align: right; }
      #s1-title .l1 { font-weight: 900; font-size: 206px; line-height: 1.12; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); }
      #s1-title .l2 { margin-top: 4px; }
      #s1-title .box {
        display: inline-block; overflow: hidden; background: var(--red); padding: 0 38px 10px; border-radius: 18px;
        font-weight: 900; font-size: 150px; line-height: 1.3; transform-origin: 100% 50%;
        box-shadow: 0 16px 40px rgba(227, 27, 35, 0.45);
      }
      .mk { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.25em 0.06em 0.3em; margin: -0.25em -0.06em -0.3em; }
      .mk > span { display: inline-block; }

      /* ---------- transition stripes (white / blue / red) */
      .stripe { position: absolute; width: 2600px; height: 760px; left: -760px; transform-origin: 50% 50%; }
      #st-w { top: 260px; background: #fff; }
      #st-b { top: 600px; background: var(--flag-blue); }
      #st-r { top: 940px; background: var(--flag-red); }

      /* ---------- S2 : حلمك ممكن */
      #s2-bg { background: radial-gradient(90% 60% at 50% 35%, #4f8cff 0%, #1f3fbf 55%, #0b1f6b 100%); }
      #s2-rays {
        position: absolute; left: -420px; top: -200px; width: 1920px; height: 1920px; opacity: 0.22;
        background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, 0.9) 0deg 6deg, rgba(255, 255, 255, 0) 6deg 18deg);
        -webkit-mask: radial-gradient(circle at 50% 50%, #000 0%, rgba(0, 0, 0, 0) 62%); mask: radial-gradient(circle at 50% 50%, #000 0%, rgba(0, 0, 0, 0) 62%);
      }
      #s2-card {
        position: absolute; left: 110px; top: 360px; width: 860px; height: 600px; border-radius: 40px; overflow: hidden;
        border: 14px solid #fff; box-shadow: 0 40px 80px rgba(5, 14, 50, 0.55); transform: rotate(-4deg);
      }
      #s2-card img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
      #s2-t1 { position: absolute; right: 132px; top: 1010px; font-weight: 900; font-size: 230px; line-height: 1.2; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
      #s2-t2 { position: absolute; right: 150px; top: 1250px; font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 220px; line-height: 1.3; color: #ffd84d; text-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
      #s2-swash { position: absolute; right: 110px; top: 1530px; }
      .spark { position: absolute; width: 70px; height: 70px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
      <audio id="music" src="assets/audio/preview_mix.wav" data-start="0" data-duration="8" data-track-index="0" data-volume="1"></audio>

      <!-- S1 : القراية في روسيا (0 – 4.3) -->
      <section id="s1" class="clip" data-start="0" data-duration="4.3" data-track-index="1" style="z-index: 10">
        <div id="s1-photo" class="fill"></div>
        <div id="s1-tint" class="fill"></div>
        <canvas id="flag" width="1080" height="1920"></canvas>
        <div id="s1-glint" class="fill"></div>
        <div id="s1-title" class="ar">
          <div class="l1"><span class="mk"><span>القراية</span></span></div>
          <div class="l2"><span class="box"><span class="mk"><span>في روسيا</span></span></span></div>
        </div>
      </section>

      <!-- S2 : حلمك ممكن! (4 – 8) -->
      <section id="s2" class="clip" data-start="4" data-duration="4" data-track-index="2" style="z-index: 20">
        <div id="s2-bg" class="fill"></div>
        <div id="s2-rays"></div>
        <div id="s2-card"><img src="assets/img/diplomes_toques.jpg" alt="" /></div>
        <div id="s2-t1" class="ar"><span class="mk"><span>حلمك</span></span></div>
        <div id="s2-t2" class="ar">ممكن!</div>
        <svg id="s2-swash" width="620" height="90" viewBox="0 0 620 90"><path id="swash-p" style="opacity: 0" d="M610 52 C 470 18, 300 70, 150 40 S 30 30, 10 66" fill="none" stroke="#e31b23" stroke-width="16" stroke-linecap="round" /></svg>
        <div id="sparks"></div>
      </section>

      <!-- transition stripes over the cut at 4.0 -->
      <section id="tr" class="clip" data-start="3.6" data-duration="0.8" data-track-index="3" style="z-index: 60">
        <div id="st-w" class="stripe"></div>
        <div id="st-b" class="stripe"></div>
        <div id="st-r" class="stripe"></div>
      </section>

      <!-- brand chip -->
      <section id="brand" class="clip" data-start="0" data-duration="8" data-track-index="4" style="z-index: 80">
        <div id="chip"><span class="dot"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 3l9 4.5-9 4.5-9-4.5z M6 10.2v4.3c0 1.7 2.7 3.5 6 3.5s6-1.8 6-3.5v-4.3" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></span><span class="t">TSSR</span><span class="bar"></span><span class="s">Study in Russia</span></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      function driver(t0, dur, draw) {
        const p = { t: 0 };
        tl.fromTo(p, { t: 0 }, { t: dur, duration: dur, ease: "none", onUpdate: () => draw(p.t) }, t0);
      }

      // ---------------- brand chip
      tl.fromTo("#chip", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, 0.25);

      // ---------------- S1 : photo push-in, waving flag unfurls, title
      tl.fromTo("#s1-photo", { scale: 1.32, filter: "blur(14px)" }, { scale: 1.06, filter: "blur(0px)", duration: 1.1, ease: "expo.out" }, 0);
      tl.to("#s1-photo", { scale: 1.0, duration: 3.2, ease: "none" }, 1.1);

      const cv = $("#flag");
      const ctx = cv.getContext("2d");
      const FX = 96, FY = 360, FW = 660, FH = 430;
      const unfurl = { u: 0 };
      tl.fromTo(unfurl, { u: 0 }, { u: 1, duration: 0.9, ease: "power3.out" }, 0.12);
      driver(0, 4.3, (t) => {
        ctx.clearRect(0, 0, 1080, 1920);
        // pole
        const g = ctx.createLinearGradient(FX - 18, 0, FX + 2, 0);
        g.addColorStop(0, "#9aa3b5"); g.addColorStop(0.5, "#f4f6fb"); g.addColorStop(1, "#7d8597");
        ctx.fillStyle = g;
        ctx.fillRect(FX - 18, FY - 40, 16, 900);
        ctx.beginPath(); ctx.arc(FX - 10, FY - 44, 14, 0, Math.PI * 2); ctx.fillStyle = "#e9c46a"; ctx.fill();
        // cloth: vertical strips displaced by a travelling wave, shaded by the wave slope
        const w = FW * unfurl.u;
        const cols = [["#ffffff", 0], ["#0039a6", 1], ["#d52b1e", 2]];
        for (let x = 0; x < w; x += 3) {
          const k = x / FW;
          const ph = (x / 330) * Math.PI * 2 - t * 2 * Math.PI * 1.15;
          const amp = 8 + 34 * k;
          const dy = amp * Math.sin(ph);
          const slope = Math.cos(ph) * (0.25 + 0.75 * k);
          const sx = FX + x;
          for (const [c, i] of cols) {
            ctx.fillStyle = c;
            ctx.fillRect(sx, FY + dy + (i * FH) / 3, 3.6, FH / 3 + 1);
          }
          ctx.fillStyle = slope > 0 ? `rgba(255,255,255,${0.16 * slope})` : `rgba(0,0,0,${-0.28 * slope})`;
          ctx.fillRect(sx, FY + dy, 3.6, FH);
        }
      });
      tl.fromTo("#flag", { x: -140, rotation: -4 }, { x: 0, rotation: 0, duration: 0.9, ease: "expo.out" }, 0.12);
      tl.fromTo("#s1-glint", { opacity: 1, xPercent: -60 }, { opacity: 1, xPercent: 60, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 1.0);
      tl.set("#s1-glint", { opacity: 0 }, 1.9);
      tl.fromTo("#s1-title .l1 .mk > span", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.95);
      tl.fromTo("#s1-title .box", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.inOut" }, 1.25);
      tl.fromTo("#s1-title .box .mk > span", { yPercent: 115 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 1.55);
      tl.to("#s1-title", { scale: 1.04, duration: 2.0, ease: "sine.inOut", transformOrigin: "100% 50%" }, 1.9);

      // ---------------- transition: three flag bands sweep right -> left over the cut (4.0)
      ["#st-w", "#st-b", "#st-r"].forEach((s, i) => {
        tl.fromTo(s, { x: 2200, rotation: -18 }, { x: -2600, rotation: -18, duration: 0.75, ease: "power2.inOut" }, 3.62 + i * 0.05);
      });

      // ---------------- S2 : photo card flies in, حلمك pops, ممكن! is written right to left
      tl.fromTo("#s2-rays", { rotation: 0 }, { rotation: 40, duration: 4, ease: "none" }, 4.0);
      tl.fromTo("#s2-card", { y: 1100, rotation: 14 }, { y: 0, rotation: -4, duration: 0.8, ease: "back.out(1.4)" }, 4.05);
      tl.fromTo("#s2-card img", { scale: 1.25 }, { scale: 1.0, duration: 3.9, ease: "power1.out" }, 4.05);
      tl.fromTo("#s2-t1 .mk > span", { yPercent: 115, scale: 0.9 }, { yPercent: 0, scale: 1, duration: 0.65, ease: "expo.out" }, 4.45);
      tl.fromTo("#s2-t2", { clipPath: "inset(-30% 0% -30% 100%)" }, { clipPath: "inset(-30% 0% -30% 0%)", duration: 0.75, ease: "power2.inOut" }, 4.9);
      const sw = $("#swash-p");
      const L = sw.getTotalLength();
      sw.style.strokeDasharray = L;
      tl.fromTo(sw, { strokeDashoffset: L, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 5.45);
      // sparkles
      const SP = [[150, 330, 0], [900, 300, 0.1], [960, 900, 0.2], [100, 1000, 0.15], [210, 1250, 0.3], [860, 1480, 0.25]];
      SP.forEach(([x, y, d], i) => {
        const el = document.createElement("div");
        el.className = "spark";
        el.style.left = x + "px"; el.style.top = y + "px";
        el.innerHTML = `<svg width="70" height="70" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z" fill="${i % 2 ? "#ffd84d" : "#ffffff"}"/></svg>`;
        $("#sparks").appendChild(el);
        tl.fromTo(el, { scale: 0, rotation: 0 }, { keyframes: [{ scale: 1.2, rotation: 45, duration: 0.25, ease: "back.out(3)" }, { scale: 0.8, rotation: 90, duration: 0.6, ease: "sine.inOut" }] }, 5.5 + d);
      });
      tl.to("#s2-card", { y: -18, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.9);

      tl.set({}, {}, 8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
